[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relancify-sdk"
version = "0.9.1"
description = "Official Python SDK for the Relancify API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25,<1.0",
  "openai-agents==0.19.1",
]
authors = [
  { name = "Relancify" },
]
keywords = ["relancify", "sdk", "voice", "agent", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.relancify.com"
Documentation = "https://github.com/NKSTUD/relancify-sdk#readme"
Repository = "https://github.com/NKSTUD/relancify-sdk"
Issues = "https://github.com/NKSTUD/relancify-sdk/issues"

[tool.setuptools.packages.find]
include = ["relancify_sdk*"]

[tool.setuptools.package-data]
relancify_sdk = ["py.typed"]
